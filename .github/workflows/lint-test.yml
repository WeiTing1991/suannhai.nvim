---
on: [push, pull_request]
name: lint-test

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --color always --check lua

  palette-sync:
    name: palette-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync palettes from suannhai-theme
        run: python3 scripts/sync-palettes.py
      - name: Check palettes are in sync
        run: |
          if git diff --quiet lua/suannhai/palettes/; then
            echo "Palettes are in sync"
          else
            echo "::error::Palettes are out of sync with suannhai-theme. Run 'python3 scripts/sync-palettes.py' and commit the changes."
            git diff lua/suannhai/palettes/
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim-versions: ['stable', 'nightly']
    name: test
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-versions }}

      - name: run tests
        run: make test
